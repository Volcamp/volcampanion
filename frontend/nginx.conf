server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Hashed build assets — safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Speaker avatars & static images — moderate cache (SW handles freshness).
  location /img/ {
    add_header Cache-Control "public, max-age=604800";
  }

  # Conference bundle must stay fresh so the app syncs on each open.
  location /data/ {
    add_header Cache-Control "no-cache";
  }

  # Never long-cache the entry, manifest or service worker, so updates ship.
  location = /index.html      { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; }
  location = /sw.js           { add_header Cache-Control "no-cache"; }
  location = /registerSW.js   { add_header Cache-Control "no-cache"; }

  # SPA fallback: unknown routes serve index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
